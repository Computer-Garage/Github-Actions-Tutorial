# create a workflow using GITHUB_STEP_SUMMARY for preparing the summary of the workflow run
name: data-passing-workflow-summary
on: push

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run build script and prepare summary
        run: |
          echo "Running build script"
          echo "Build completed"
          echo "Build output: Build successful" >> $GITHUB_STEP_SUMMARY

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Write test-job summary
        run: |
          echo "Build job completed successfully." >> "$GITHUB_STEP_SUMMARY"
