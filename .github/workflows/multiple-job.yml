# multi-job workflow with building an angular application
name: multi-job-workflow
on: push
jobs:
    job1:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Set up Node.js
              uses: actions/setup-node@v2
              with:
                node-version: '14'

            - name: Install dependencies
              run: npm install

            - name: Build Angular application
              run: npm run build --prod
    job2:
        runs-on: ubuntu-latest
        needs: job1
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Set up Node.js
              uses: actions/setup-node@v2
              with:
                node-version: '14'

            - name: Run tests
              run: npm test
