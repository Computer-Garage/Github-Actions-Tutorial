# create a workflow to pass data between jobs in a multi-step github actions workflow using $GITHUB_OUTPUT 

name: data-passing-workflow
on: push

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_output: ${{ steps.build_step.outputs.build_output }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run build script and set output
        id: build_step
        run: |
          echo "Running build script"
          echo "Build completed"
          echo "build_output=Build successful" >> $GITHUB_OUTPUT

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use output from build job
        env:
          BUILD_OUTPUT: ${{ needs.build.outputs.build_output }}
        run: |
          echo "Using output from build job"
          echo "Build output: $BUILD_OUTPUT"
